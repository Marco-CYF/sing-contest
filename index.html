<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>歌唱比賽評分系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1120;--bg2:#141830;--panel:#1a1f38;--panel2:#232948;--line:#30375c;
  --text:#eef0f8;--mute:#9aa2c4;--gold:#f4c24f;--gold2:#ffe199;--ok:#35d08f;--warn:#f6a623;--bad:#f05468;--blue:#6c8cff;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 600px at 85% -10%,#2b2252 0,transparent 60%),var(--bg);color:var(--text);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 14px;transition:.15s}
button:hover:not(:disabled){border-color:var(--blue)}
button.pri{background:var(--gold);color:#1d1600;border-color:var(--gold);font-weight:700}
button.ok{background:var(--ok);color:#03210f;border-color:var(--ok);font-weight:700}
button.bad{background:transparent;color:var(--bad);border-color:#5d2b39}
button.ghost{background:transparent}
button.sm{padding:4px 9px;font-size:13px}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
input:disabled,textarea:disabled{opacity:.55}
h1{font-size:30px;margin:6px 0}
h3{margin:0 0 12px;font-size:16px}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;
  background:rgba(14,17,32,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .t{font-weight:800;font-size:17px;letter-spacing:.5px}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip.open{color:var(--ok);border-color:#1f6a4b}.chip.locked{color:var(--gold);border-color:#6b5520}.chip.wait{color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);display:inline-block;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
main{max-width:1280px;margin:0 auto;padding:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--mute)}.small{font-size:13px}.warn{color:var(--warn)}.okc{color:var(--ok)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row+.row{margin-top:12px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stack>*+*{margin-top:16px}
.lbl{display:block;margin:0 0 14px;color:var(--mute);font-size:13px}
.lbl input,.lbl select,.lbl .seg{margin-top:5px;color:var(--text);font-size:15px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--mute);font-weight:600;font-size:13px;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.cur td{background:rgba(244,194,79,.08)}
.tablewrap{overflow-x:auto}
table.edit td{padding:5px 6px}
table.edit input{padding:6px 8px}
.nowrap{white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px}
.infobox{padding:10px 14px;border-radius:10px;background:rgba(108,140,255,.12);border:1px solid #3a4a8a;font-size:14px;margin-bottom:14px}
.warnbox{padding:10px 14px;border-radius:10px;background:rgba(246,166,35,.12);border:1px solid #6d5222;font-size:14px;margin:12px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}
.seg button.act{background:var(--gold);color:#1d1600;font-weight:700}
.bar{height:8px;border-radius:9px;background:var(--bg2);overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--ok))}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:#000c;border:1px solid var(--line);padding:10px 18px;border-radius:12px;transition:.25s;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%)}

/* 身分選擇 */
.picker{max-width:880px;margin:20px auto}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:22px}
.seat{text-align:left;display:flex;flex-direction:column;gap:3px;padding:16px;border-radius:14px;background:var(--panel)}
.seat b{font-size:19px}.seat .sn{color:var(--gold);font-size:13px;font-weight:700}

/* 舞台卡 */
.stage .big-no{font-size:64px;font-weight:900;color:var(--gold);line-height:1;margin-top:10px}
.stage .cname{font-size:34px;font-weight:800;margin:6px 0}
.stage .song{font-size:22px;color:var(--gold2);margin-top:8px}
.stage.mini .cname{font-size:26px}.stage.mini .song{font-size:18px}

/* 評分表 */
.crit{display:grid;grid-template-columns:1fr 1.3fr 90px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.crit input[type=number]{text-align:center;font-size:20px;font-weight:700;padding:6px}
input[type=range]{padding:0;accent-color:var(--gold);background:transparent;border:0}
input[type=range].unset{accent-color:#555b78;opacity:.6}
.total{display:flex;align-items:baseline;justify-content:space-between;margin:14px 0 10px}
.total b{font-size:40px;color:var(--gold);font-variant-numeric:tabular-nums}

/* 管理員 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:transparent;border-color:transparent}
.tabs button.act{background:var(--panel2);border-color:var(--line);color:var(--gold);font-weight:700}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.jcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg2)}
.jcard.done{border-color:#24714f}
.jcard .jt{font-size:30px;font-weight:800;color:var(--gold);margin:4px 0;font-variant-numeric:tabular-nums}
.avg{margin-top:14px;font-size:18px}.avg b{font-size:30px;color:var(--gold)}

/* ===== 大螢幕畫面（以容器寬高為單位，大螢幕與導播台監看共用） ===== */
.scr{--sa:#f2c14e;--sa2:#ffe6a6;--sb:#07091a;--st:#f6f3ec;--sm:rgba(246,243,236,.6);--sl:rgba(255,255,255,.13);--g1:rgba(118,72,255,.38);--g2:rgba(242,193,78,.22);
  position:relative;overflow:hidden;container-type:size;background:var(--sb);color:var(--st);display:flex;flex-direction:column;
  font-family:"Noto Sans TC",system-ui,"Microsoft JhengHei","PingFang TC",sans-serif;line-height:1.25}
.scr.th-blue{--sa:#5cc8ff;--sa2:#c6ecff;--sb:#030a1c;--g1:rgba(0,110,255,.4);--g2:rgba(92,200,255,.2)}
.scr.th-red{--sa:#ffcf6e;--sa2:#ffeac0;--sb:#130409;--g1:rgba(205,22,52,.45);--g2:rgba(255,207,110,.18)}
.scr.th-light{--sa:#a26d12;--sa2:#5c3f0b;--sb:#f6f3ec;--st:#1a1916;--sm:rgba(26,25,22,.58);--sl:rgba(0,0,0,.1);--g1:rgba(162,109,18,.14);--g2:rgba(70,100,190,.1)}
.scr-bg{position:absolute;inset:0;z-index:0;overflow:hidden}
.scr-bg .glow{position:absolute;inset:-20%;background:radial-gradient(38% 48% at 16% 12%,var(--g1),transparent 70%),radial-gradient(42% 52% at 88% 92%,var(--g2),transparent 70%);animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.06)}}
.scr-bg img{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;filter:blur(.35cqw)}
.scr-bg .dim{position:absolute;inset:0;background:var(--sb)}
.scr>*:not(.scr-bg){position:relative;z-index:1}
.scr-head{display:flex;justify-content:space-between;align-items:center;gap:3cqw;padding:2.4cqh 3.6cqw;font-size:1.45cqw;letter-spacing:.08em;border-bottom:1px solid var(--sl)}
.scr-head:empty,.scr-tick:empty{display:none}
.hd-l{display:flex;align-items:center;gap:1.2cqw;font-weight:700}
.hd-l img{height:4.6cqh;max-width:14cqw;object-fit:contain}
.hd-r{color:var(--sm);text-align:right}
.scr-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4cqh 6cqw;text-align:center}
.scr-tick{display:flex;align-items:stretch;height:7cqh;flex:none;background:rgba(0,0,0,.4);border-top:1px solid var(--sl);font-size:2cqw}
.th-light .scr-tick{background:rgba(0,0,0,.05)}
.tk-label{background:var(--sa);color:var(--sb);font-weight:900;display:flex;align-items:center;padding:0 2.2cqw;letter-spacing:.12em;white-space:nowrap}
.tk-track{flex:1;overflow:hidden;white-space:nowrap;display:flex;align-items:center}
.tk-track span{display:inline-block;padding-left:100%;animation:tick linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.scr.clean .scr-head,.scr.clean .scr-tick{display:none}
.scr.clean .scr-body{padding:0}
.scr.black{background:#000}.scr.black>*{display:none}

.eyebrow{font-size:1.5cqw;letter-spacing:.5em;color:var(--sa);font-weight:700;text-transform:uppercase;margin-bottom:2.2cqh;display:flex;align-items:center;justify-content:center;gap:1.4cqw}
.big-title{font-size:6.4cqw;font-weight:900;line-height:1.15;margin:0;letter-spacing:.04em}
.subt{font-size:2.3cqw;color:var(--sm);margin-top:3cqh;letter-spacing:.12em}
.rule{width:7cqw;height:.45cqh;background:var(--sa);margin:4.5cqh auto 0;border-radius:9px}
.st-logo{display:block;max-height:20cqh;max-width:36cqw;object-fit:contain;margin:0 auto 4cqh}
.anim>*{animation:fadeUp .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(3cqh)}}

.sc-poster{position:absolute;inset:0;background:#000}
.sc-poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.sc-poster.cover img.main{object-fit:cover}
.sc-poster img.blur{object-fit:cover;filter:blur(3cqw) brightness(.4);transform:scale(1.15)}
.sc-poster .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sm);font-size:2.4cqw}

.sc-current{width:100%;text-align:left}
.sc-current .eyebrow{justify-content:flex-start}
.cur-tag{letter-spacing:.15em;border:1px solid var(--sa);border-radius:99px;padding:.5cqh 1.3cqw;font-size:1.3cqw;text-transform:none}
.cur-grid{display:grid;grid-template-columns:auto 1fr;gap:4.5cqw;align-items:center}
.cur-no{font-size:17cqw;font-weight:900;line-height:.85;color:transparent;-webkit-text-stroke:.22cqw var(--sa);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cur-name{font-size:7.2cqw;font-weight:900;line-height:1.1;letter-spacing:.03em}
.cur-song{font-size:3.6cqw;color:var(--sa2);margin-top:2.4cqh;display:flex;gap:1.4cqw;align-items:center;font-weight:700}
.cur-song .note{display:inline-flex;align-items:center;justify-content:center;width:5.4cqw;height:5.4cqw;border-radius:50%;background:var(--sa);color:var(--sb);font-size:2.6cqw;flex:none}
.cur-artist{font-size:1.9cqw;color:var(--sm);margin-top:1.4cqh;padding-left:6.8cqw}
.jprog{display:flex;flex-wrap:wrap;gap:1.2cqh 3cqw;margin-top:6cqh;padding-top:3cqh;border-top:1px solid var(--sl)}
.jp{display:flex;align-items:center;gap:.9cqw;font-size:1.6cqw;color:var(--sm)}
.jp i{width:1.1cqw;height:1.1cqw;border-radius:50%;border:.2cqw solid var(--sm)}
.jp.ok{color:var(--st)}.jp.ok i{background:var(--sa);border-color:var(--sa);box-shadow:0 0 1.2cqw var(--sa)}

.sc-name{font-size:5.4cqw;font-weight:900}
.sc-song{font-size:2.4cqw;color:var(--sa2);margin-top:1.4cqh}
.sc-val{font-size:17cqw;font-weight:900;line-height:1;margin-top:3.5cqh;color:var(--sa);font-variant-numeric:tabular-nums;animation:pop 1s cubic-bezier(.2,1.5,.4,1) both;text-shadow:0 0 6cqw color-mix(in srgb,var(--sa) 45%,transparent)}
.sc-val small{font-size:2.8cqw;color:var(--sm);font-weight:500;text-shadow:none}
@keyframes pop{from{transform:scale(.55);opacity:0}}
.sc-det{display:flex;justify-content:center;gap:1.8cqw;margin-top:4.5cqh;flex-wrap:wrap}
.sc-det div{border:1px solid var(--sl);border-radius:1cqw;padding:1.6cqh 2.4cqw;min-width:13cqw;background:color-mix(in srgb,var(--st) 4%,transparent)}
.sc-det span{display:block;font-size:1.35cqw;color:var(--sm)}.sc-det b{font-size:3cqw;font-variant-numeric:tabular-nums}
.sc-wait{font-size:2.6cqw;color:var(--sm);margin-top:7cqh;display:flex;align-items:center;justify-content:center;gap:1.6cqw}
.spin{width:2.6cqw;height:2.6cqw;border:.35cqw solid var(--sl);border-top-color:var(--sa);border-radius:50%;animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

.sc-board,.sc-lineup{width:100%;max-width:82cqw}
.sc-board h2,.sc-lineup h2{font-size:3.8cqw;margin:0 0 3.4cqh;font-weight:900;letter-spacing:.06em}
.bd-list{display:grid;gap:1.3cqh}
.bd-list.two{grid-auto-flow:column;grid-template-columns:1fr 1fr;column-gap:2.4cqw}
.bd-row{display:grid;grid-template-columns:6.5cqw 1fr auto;align-items:center;gap:2cqw;padding:1.7cqh 2.4cqw;border-radius:1.1cqw;background:color-mix(in srgb,var(--st) 5%,transparent);border:1px solid var(--sl);text-align:left;font-size:2.4cqw}
.bd-list.dense .bd-row{font-size:1.9cqw;padding:1.15cqh 2cqw}
.bd-rk{font-weight:900;font-size:1.15em;color:var(--sm);text-align:center;font-variant-numeric:tabular-nums}
.bd-nm{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-nm small{display:block;font-size:.58em;color:var(--sm);font-weight:400;margin-top:.3cqh;overflow:hidden;text-overflow:ellipsis}
.bd-sc{font-weight:900;font-variant-numeric:tabular-nums;color:var(--sa)}
.bd-row.r1{background:linear-gradient(90deg,color-mix(in srgb,#f2c14e 30%,transparent),color-mix(in srgb,#f2c14e 6%,transparent));border-color:#f2c14e}
.bd-row.r1 .bd-rk{color:#f2c14e}.bd-row.r2 .bd-rk{color:#d3dbea}.bd-row.r3 .bd-rk{color:#e09a62}
.th-light .bd-row.r1 .bd-rk{color:#a26d12}.th-light .bd-row.r2 .bd-rk{color:#6d7890}.th-light .bd-row.r3 .bd-rk{color:#a8602b}
.bd-row.masked .bd-nm,.bd-row.masked .bd-sc{color:var(--sm);letter-spacing:.3em}
.anim .bd-row,.anim .lu-row{animation:rowIn .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rowIn{from{opacity:0;transform:translateX(-3cqw)}}
.bd-row.reveal{animation:revealRow 1.3s cubic-bezier(.2,.9,.3,1) both}
@keyframes revealRow{0%{opacity:0;transform:scale(.9)}55%{opacity:1;transform:scale(1.05);box-shadow:0 0 5cqw var(--sa)}100%{transform:none;box-shadow:none}}

.lu-list{display:grid;gap:1.1cqh}
.lu-row{display:grid;grid-template-columns:6cqw 1fr 1.25fr 11cqw;gap:2cqw;align-items:center;padding:1.5cqh 2.4cqw;border-radius:1cqw;border:1px solid var(--sl);font-size:2.1cqw;text-align:left;background:color-mix(in srgb,var(--st) 3%,transparent)}
.lu-row.done{opacity:.38}
.lu-row.now{border-color:var(--sa);background:color-mix(in srgb,var(--sa) 16%,transparent)}
.lu-row.next{border-color:color-mix(in srgb,var(--sa) 45%,transparent)}
.lu-no{font-weight:900;color:var(--sa);font-variant-numeric:tabular-nums}
.lu-nm{font-weight:800}.lu-song{color:var(--sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lu-st{font-size:1.35cqw;letter-spacing:.15em;text-align:right;color:var(--sm)}
.lu-row.now .lu-st{color:var(--sa);font-weight:900}

/* 大螢幕裝置 */
body[data-view=display] .top{display:none}
body[data-view=display] main{max-width:none;padding:0}
.dwrap .scr{width:100vw;height:100vh}
.dwrap.idle{cursor:none}
.dctl{position:fixed;right:14px;top:14px;z-index:5;display:flex;gap:8px;align-items:center;opacity:0;transition:.3s;background:rgba(0,0,0,.55);padding:8px 10px;border-radius:12px}
.dwrap:not(.idle):hover .dctl{opacity:1}

/* ===== 導播台 ===== */
.sw-mons{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;margin-bottom:16px}
.mon{background:#000;border-radius:14px;padding:10px;border:1px solid var(--line)}
.mon.pg{border-color:#7d2331;box-shadow:0 0 0 1px #7d2331,0 10px 40px rgba(200,40,58,.18)}
.mon-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:0 4px 8px;color:var(--mute)}
.tag{font-weight:800;letter-spacing:.1em}.tag.pv{color:var(--ok)}.tag.pg{color:#ff5468}
.mon .scr{width:100%;aspect-ratio:16/9;border-radius:6px}
.sw-take{display:flex;flex-direction:column;align-items:center;gap:12px}
.take{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff5e6e,#b51d30);border:2px solid #ff8a96;color:#fff;font-weight:900;font-size:22px;letter-spacing:.08em;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(200,40,58,.45)}
.take small{font-size:12px;font-weight:600;letter-spacing:.2em;opacity:.85}
.take:active{transform:scale(.95)}
.take.same{filter:saturate(.35) brightness(.75);box-shadow:none}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:12px}
.scene{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;position:relative;font-weight:600}
.scene .ic{font-size:22px;color:var(--gold)}
.scene.sel{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok);background:rgba(53,208,143,.08)}
.scene.live::after{content:'LIVE';position:absolute;top:6px;right:6px;font-size:10px;background:#c8283a;color:#fff;padding:1px 6px;border-radius:4px;font-weight:800;letter-spacing:.05em}
.ck{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;margin:4px 0 10px}
.ck input{width:auto;accent-color:var(--gold)}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.apick{display:flex;flex-wrap:wrap;gap:8px}
.ap{width:92px;height:52px;padding:0;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mute)}
.ap img{width:100%;height:100%;object-fit:contain}
.ap.on{border:2px solid var(--gold);box-shadow:0 0 0 2px rgba(244,194,79,.25)}
.reveal-box{margin-top:12px;padding:14px;border-radius:12px;border:1px solid #6b5520;background:rgba(244,194,79,.07)}
.reveal-box p{margin:6px 0 10px}
.btnlike{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border-radius:10px;padding:8px 14px;background:var(--gold);color:#1d1600;font-weight:700}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:10px}
.asset{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg2)}
.asset.on{border-color:var(--gold)}
.asset .th{aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px}
.asset .th img{width:100%;height:100%;object-fit:contain}
.asset .meta{padding:8px 10px;font-size:12px}
.asset .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);font-size:13px}

<body>
<header class="top" id="top"></header>
<main id="app"></main>
<div id="toast"></div>

<script>
/* ================= 基本工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const clone = o => JSON.parse(JSON.stringify(o));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
function download(text, name, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const hm = t => new Date(t).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });

/* ================= 本機身分（每台電腦記住自己） ================= */
const me = { device: LS.get('sc_device', null), label: LS.get('sc_label', ''), role: LS.get('sc_role', null), seat: LS.get('sc_seat', null) };
if (!me.device) { me.device = uid(); LS.set('sc_device', me.device); }
function saveMe() { LS.set('sc_label', me.label); LS.set('sc_role', me.role); LS.set('sc_seat', me.seat); }

/* ================= 比賽資料 ================= */
const DISPLAY_DEFAULT = () => ({
  scene: 'standby', theme: 'gold', bg: null, bgDim: 80,
  header: { on: true, left: '', right: '' },
  ticker: { on: false, label: '最新消息', text: '', speed: 'normal' },
  logo: { id: null, on: false },
  standby: { label: 'Welcome', sub: '' },
  poster: { id: null, fit: 'contain', clean: true },
  current: { progress: true },
  score: { detail: true },
  board: { rid: '', group: '', top: 10, hide: 0, song: true },
  qualify: { rid: '', song: false },
  lineup: { count: 8 },
  msg: { label: 'Intermission', title: '中場休息', sub: '比賽將於 15 分鐘後繼續' }
});
const ROUND_NAMES = ['初賽', '複賽', '決賽'];
const ROUND_DEFAULT = i => ({ name: ROUND_NAMES[i] || `第 ${i + 1} 輪`, contestants: [], current: null, advance: i === 0 ? 5 : 0, advMode: 'group', advOrder: 'reverse', keepSong: false, auto: true, carry: 0 });
const GROUP_PRESETS = ['個人組', '團體組'];
const DEFAULT = () => ({
  settings: { title: '歌唱比賽', scale: 10, decimals: 2 },
  criteria: [
    { id: 'c1', name: '音準與節奏', weight: 30 },
    { id: 'c2', name: '音色與技巧', weight: 30 },
    { id: 'c3', name: '詮釋與情感', weight: 25 },
    { id: 'c4', name: '台風與表現', weight: 15 }
  ],
  judges: [{ id: 's1', name: '評審老師 A' }, { id: 's2', name: '評審老師 B' }, { id: 's3', name: '評審老師 C' }],
  contestants: [], current: null, status: {}, scores: {}, assets: [], display: DISPLAY_DEFAULT()
});
function normalize(s) {
  s = (s && typeof s === 'object') ? s : {};
  const legacyC = Array.isArray(s.contestants) ? s.contestants : null, legacyCur = s.current;
  const d = DEFAULT();
  for (const k in d) if (s[k] == null) s[k] = d[k];
  s.settings = Object.assign(d.settings, s.settings);
  const dd = DISPLAY_DEFAULT(), od = (s.display && typeof s.display === 'object') ? s.display : {};
  if (od.mode && !od.scene) od.scene = { current: 'current', score: 'score', results: 'board' }[od.mode] || 'current';
  const disp = Object.assign({}, dd, od);
  for (const k in dd) if (dd[k] && typeof dd[k] === 'object') disp[k] = Object.assign({}, dd[k], od[k] || {});
  delete disp.mode; s.display = disp;
  if (!Array.isArray(s.assets)) s.assets = [];
  // 賽次：每個賽次有自己的名單與目前選手；S.contestants / S.current 永遠指向「進行中」的賽次
  if (!s.rounds || typeof s.rounds !== 'object' || Array.isArray(s.rounds)) s.rounds = {};
  if (!Array.isArray(s.roundIds) || !s.roundIds.length) s.roundIds = [...new Set(['r1', 'r2', ...Object.keys(s.rounds)])];
  s.roundIds = s.roundIds.filter((x, i, a) => typeof x === 'string' && a.indexOf(x) === i);
  s.roundIds.forEach((id, i) => {
    const raw = (s.rounds[id] && typeof s.rounds[id] === 'object') ? s.rounds[id] : {};
    const had = Array.isArray(raw.contestants), r = Object.assign(ROUND_DEFAULT(i), raw);
    if (!had && i === 0 && legacyC) { r.contestants = legacyC; if (raw.current === undefined) r.current = legacyCur ?? null; }
    if (!Array.isArray(r.contestants)) r.contestants = [];
    r.contestants.forEach(c => { if (!c.pid) c.pid = c.id; });
    s.rounds[id] = r;
  });
  if (!s.roundIds.includes(s.round)) s.round = s.roundIds[0];
  s.contestants = s.rounds[s.round].contestants; s.current = s.rounds[s.round].current ?? null;
  return s;
}

let S = normalize({}), clients = [], meta = { requirePin: false };
let mode = 'server', online = false, everConnected = false, es = null, bc = null;
let drafts = LS.get('sc_drafts', {});
let adminTab = sessionStorage.getItem('sc_tab') || 'control';
let resSort = 'rank', resGroup = '', pendingFocus = null;

const scale = () => +S.settings.scale || 10;
const stepOf = () => scale() === 10 ? 0.1 : 1;
const fmt = (n, d) => n == null ? '—' : (n * scale()).toFixed(d ?? S.settings.decimals);
const fmtIn = n => n == null ? '' : String(+(n * scale()).toFixed(scale() === 10 ? 1 : 0));
const cById = id => S.contestants.find(c => c.id === id);
const idx = id => S.contestants.findIndex(c => c.id === id);
const jName = seat => (S.judges.find(j => j.id === seat) || {}).name || '（席位已移除）';
const seatNo = seat => S.judges.findIndex(j => j.id === seat) + 1;
const stOf = cid => (S.status || {})[cid] || 'wait';
const ST_LABEL = { wait: '待評分', open: '評分中', locked: '已鎖定' };
const onlineAt = seat => clients.filter(c => c.role === 'judge' && c.seat === seat);
const dk = cid => me.seat + ':' + cid;
const saveDrafts = () => LS.set('sc_drafts', drafts);

// 單一評審總分（0~1）：加權平均
function judgeTotal(sc) {
  if (!sc || !sc.items) return null;
  let sw = 0, sum = 0; const vals = [];
  for (const c of S.criteria) {
    const v = sc.items[c.id]; if (v == null) continue;
    const w = +c.weight > 0 ? +c.weight : 0; sw += w; sum += v * w; vals.push(v);
  }
  if (!vals.length) return null;
  return sw ? sum / sw : vals.reduce((a, b) => a + b, 0) / vals.length;
}
// 選手最終成績：已送出評審的平均
function result(cid) {
  const per = S.judges.map(j => judgeTotal((S.scores[cid] || {})[j.id]));
  const got = per.filter(x => x != null);
  return { per, n: got.length, avg: got.length ? got.reduce((a, b) => a + b, 0) / got.length : null };
}
const R = rid => S.rounds[rid || S.round];
const rName = rid => (R(rid) || {}).name || '';
const prevRid = rid => { const i = S.roundIds.indexOf(rid); return i > 0 ? S.roundIds[i - 1] : null; };
const nextRid = rid => { const i = S.roundIds.indexOf(rid); return i >= 0 && i < S.roundIds.length - 1 ? S.roundIds[i + 1] : null; };
// 賽次總成績：本賽次平均，可依設定加計前一賽次成績
function finalScore(rid, c, depth) {
  const a = result(c.id).avg; if (a == null) return null;
  const r = R(rid), carry = Math.max(0, Math.min(100, +r.carry || 0)), pr = prevRid(rid);
  if (!carry || !pr || (depth || 0) > 6) return a;
  const pc = R(pr).contestants.find(x => x.pid === c.pid);
  const pf = pc ? finalScore(pr, pc, (depth || 0) + 1) : null;
  return pf == null ? a : a * (100 - carry) / 100 + pf * carry / 100;
}
function rankRound(rid, group, exact) {
  const rows = R(rid).contestants.map((c, i) => ({ c, i, r: result(c.id), f: finalScore(rid, c) }))
    .filter(x => exact ? (x.c.group || '') === group : (!group || x.c.group === group));
  const scored = rows.filter(x => x.f != null).sort((a, b) => b.f - a.f);
  let last = null, rank = 0;
  scored.forEach((x, k) => { const v = fmt(x.f); if (v !== last) { rank = k + 1; last = v; } x.rank = rank; });
  return { rows, scored };
}
const ranking = group => rankRound(S.round, group);
// 晉級名單：依設定取總排名或各組前 N 名；卡在最後名額同分者一併晉級
function qualifiers(rid) {
  const r = R(rid), n = +r.advance || 0; if (!n) return [];
  const groups = r.advMode === 'group' ? [...new Set(r.contestants.map(c => c.group || ''))] : [null];
  const out = [];
  for (const g of groups) {
    const { scored } = g === null ? rankRound(rid, '') : rankRound(rid, g, true);
    const cut = scored[n - 1];
    out.push(...(cut ? scored.filter(x => x.rank <= cut.rank) : scored));
  }
  return out;
}
const roundDone = rid => { const l = R(rid).contestants; return l.length > 0 && l.every(c => stOf(c.id) === 'locked'); };
const hasScores = rid => R(rid).contestants.some(c => S.scores[c.id] && Object.keys(S.scores[c.id]).length);

/* ================= 同步連線 ================= */
function applyOp(s, op) {
  if (op.op === 'replace') return normalize(clone(op.value || {}));
  let o = s; const p = op.path;
  for (let i = 0; i < p.length - 1; i++) { if (o[p[i]] == null || typeof o[p[i]] !== 'object') o[p[i]] = {}; o = o[p[i]]; }
  const k = p[p.length - 1];
  if (op.op === 'del') delete o[k]; else o[k] = op.value;
  return s;
}
function connect() { if (GIST.id) startGist(); else if (location.protocol.startsWith('http')) openES(); else startLocal(); }

/* ---------- GitHub Gist 雲端同步（GitHub Pages 用） ----------
 * contest.json        ：比賽設定、選手、評審、進度（管理員寫入）
 * scores-<席位>.json   ：每位評審各自一個檔案，同時送分也不會互相覆蓋
 * device-<裝置>.json   ：各電腦定期回報身分，用來對照「哪台電腦是哪位老師」
 */
const GIST = { id: LS.get('sc_gist', ''), token: LS.get('sc_token', '') };
(function readSetupLink() {
  const m = location.hash.match(/setup=([^&]+)/); if (!m) return;
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    if (o.g) { GIST.id = o.g; GIST.token = o.t || ''; LS.set('sc_gist', GIST.id); LS.set('sc_token', GIST.token); }
  } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search);
})();
const GAPI = 'https://api.github.com/gists/';
const BOOT = Date.now();
let gEtag = null, gTimer = null, gBeatT = null, gHas = false, gErr = '', gLast = 0;
const gHeaders = extra => Object.assign({ 'Accept': 'application/vnd.github+json' }, GIST.token ? { 'Authorization': 'Bearer ' + GIST.token } : {}, extra || {});
function gErrMsg(st) {
  return st === 401 ? '權杖無效或已過期' : st === 404 ? '找不到這個 Gist，或權杖沒有讀取權限' : st === 403 || st === 429 ? 'GitHub 暫時限制請求次數，請稍候' : st === 422 ? '資料格式被 GitHub 拒絕' : '無法連線到 GitHub，請檢查網路';
}
function ingest(g) {
  let base = {}; const scores = {}, devs = [];
  for (const [name, file] of Object.entries(g.files || {})) {
    let obj; try { obj = JSON.parse(file.content || '{}'); } catch (e) { continue; }
    if (name === 'contest.json') base = obj;
    else if (/^scores-.+\.json$/.test(name)) { const seat = name.slice(7, -5); for (const cid in obj) (scores[cid] = scores[cid] || {})[seat] = obj[cid]; }
    else if (/^device-.+\.json$/.test(name)) devs.push(obj);
  }
  gHas = !!(g.files || {})['contest.json'];
  base.scores = scores; S = normalize(base);
  clients = devs.filter(d => d && Date.now() - d.at < 7 * 60e3).map(d => Object.assign({}, d, { since: d.at }));
  if (!clients.some(c => c.device === me.device)) clients.push({ device: me.device, label: me.label, role: me.role, seat: me.seat, since: BOOT });
  gLast = Date.now(); online = true; gErr = '';
}
async function gFetch(force) {
  const r = await fetch(GAPI + encodeURIComponent(GIST.id), { cache: 'no-store', headers: gHeaders(!force && gEtag ? { 'If-None-Match': gEtag } : {}) });
  if (r.status === 304) { gLast = Date.now(); online = true; return false; }
  if (!r.ok) { const e = new Error('gist'); e.status = r.status; throw e; }
  gEtag = r.headers.get('ETag'); ingest(await r.json()); return true;
}
function splitState(s) {
  const contest = clone(s); delete contest.scores; delete contest.contestants; delete contest.current;
  const sc = {};
  for (const cid in s.scores || {}) for (const seat in s.scores[cid] || {}) (sc[seat] = sc[seat] || {})[cid] = s.scores[cid][seat];
  return { contest, sc };
}
async function gPatch(files) {
  const r = await fetch(GAPI + encodeURIComponent(GIST.id), { method: 'PATCH', cache: 'no-store', headers: gHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ files }) });
  if (!r.ok) { const e = new Error('gist'); e.status = r.status; throw e; }
  return r.json();
}
async function gSend(ops) {
  if (!GIST.token) { toast('這台電腦沒有設定 GitHub 權杖，無法寫入'); return false; }
  try {
    await gFetch(true); // 先抓最新版本再修改，避免蓋掉別人的變更
    for (const op of ops) {
      const p = op.path || [];
      if (p[0] === 'scores' && p.length === 3 && me.role === 'judge' && stOf(p[1]) !== 'open') { toast('此選手目前不開放評分（未開放或已鎖定）'); render(); return false; }
    }
    const before = splitState(S);
    let s = clone(S); for (const op of ops) s = applyOp(s, op); s = normalize(s);
    const after = splitState(s), files = {};
    if (!gHas || JSON.stringify(before.contest) !== JSON.stringify(after.contest)) files['contest.json'] = { content: JSON.stringify(after.contest, null, 1) };
    for (const seat of new Set([...Object.keys(before.sc), ...Object.keys(after.sc)])) {
      const a = after.sc[seat] || {}, b = before.sc[seat] || {};
      if (JSON.stringify(a) !== JSON.stringify(b)) files[`scores-${seat}.json`] = { content: JSON.stringify(a, null, 1) };
    }
    if (Object.keys(files).length) { ingest(await gPatch(files)); gEtag = null; }
    render(); return true;
  } catch (e) { gErr = gErrMsg(e.status); toast('寫入失敗：' + gErr); render(); return false; }
}
let gBeatPending = null;
function gBeat() {
  if (mode !== 'gist' || !GIST.token) return;
  clearTimeout(gBeatPending);
  gBeatPending = setTimeout(() => {
    const info = { device: me.device, label: me.label, role: me.role || '', seat: me.seat || '', at: Date.now() };
    gPatch({ [`device-${me.device}.json`]: { content: JSON.stringify(info) } }).catch(() => {});
  }, 800);
}
function gLoop() {
  clearTimeout(gTimer);
  const iv = document.hidden ? 15000 : (me.role ? 2500 : 6000);
  gTimer = setTimeout(async () => {
    try { if (await gFetch()) render(); else if (!online) render(); }
    catch (e) { gErr = gErrMsg(e.status); if (online) { online = false; render(); } }
    gLoop();
  }, iv);
}
document.addEventListener('visibilitychange', () => { if (mode === 'gist' && !document.hidden) { gLoop(); gFetch().then(ch => ch && render()).catch(() => {}); } });
async function startGist() {
  mode = 'gist'; meta = { requirePin: false };
  if (es) { es.close(); es = null; }
  try { await gFetch(true); } catch (e) { gErr = gErrMsg(e.status); online = false; }
  render(); gLoop(); gBeat();
  clearInterval(gBeatT); gBeatT = setInterval(gBeat, 3 * 60e3);
}
function openES() {
  mode = 'server';
  if (es) es.close();
  const q = new URLSearchParams({ device: me.device, label: me.label || '', role: me.role || '', seat: me.seat || '' });
  es = new EventSource('/events?' + q);
  es.addEventListener('state', e => {
    everConnected = true; online = true;
    const m = JSON.parse(e.data); S = normalize(m.state); meta = m.meta || meta; render();
  });
  es.addEventListener('presence', e => { clients = JSON.parse(e.data); render(); });
  es.onopen = () => { online = true; render(); };
  es.onerror = () => {
    online = false;
    if (!everConnected) { es.close(); es = null; startLocal(); } else render();
  };
}
function startLocal() {
  mode = 'local'; online = true; meta = { requirePin: false };
  S = normalize(LS.get('sc_state_local', {}));
  if (!bc) {
    try { bc = new BroadcastChannel('sc_local'); bc.onmessage = e => { if (e.data && e.data.t === 'state') { S = normalize(e.data.s); render(); } }; } catch (e) {}
    window.addEventListener('storage', e => { if (e.key === 'sc_state_local') { S = normalize(LS.get('sc_state_local', {})); render(); } });
  }
  clients = [{ device: me.device, label: me.label, role: me.role, seat: me.seat, since: Date.now() }];
  render();
}
function reconnect() { if (mode === 'server') openES(); else if (mode === 'gist') { clients = clients.filter(c => c.device !== me.device).concat([{ device: me.device, label: me.label, role: me.role, seat: me.seat, since: BOOT }]); gBeat(); gLoop(); } else { clients = [{ device: me.device, label: me.label, role: me.role, seat: me.seat, since: Date.now() }]; } }

async function send(ops) {
  ops = ops.map(op => { const p = op.path || []; return (p[0] === 'current' || p[0] === 'contestants') ? Object.assign({}, op, { path: ['rounds', S.round, ...p] }) : op; });
  if (mode === 'gist') return gSend(ops);
  if (mode === 'local') {
    for (const op of ops) {
      const p = op.path || [];
      if (p[0] === 'scores' && p.length === 3 && me.role === 'judge' && stOf(p[1]) !== 'open') { toast('此選手目前不開放評分'); return false; }
    }
    let s = clone(S); for (const op of ops) s = applyOp(s, op);
    S = normalize(s); LS.set('sc_state_local', S);
    if (bc) bc.postMessage({ t: 'state', s: S });
    render(); return true;
  }
  try {
    const r = await fetch('/api/ops', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ ops, pin: sessionStorage.getItem('sc_pin') || '' }) });
    if (r.status === 403) { sessionStorage.removeItem('sc_pin'); toast('管理員 PIN 錯誤'); if (me.role === 'admin') askPin(); return false; }
    if (r.status === 409) { toast('此選手目前不開放評分（未開放或已鎖定）'); return false; }
    if (!r.ok) throw new Error(r.status);
    return true;
  } catch (e) { toast('送出失敗，請檢查網路連線後再試一次'); return false; }
}
async function askPin() {
  const p = prompt('請輸入管理員 PIN');
  if (p == null) { me.role = null; saveMe(); reconnect(); render(); return; }
  sessionStorage.setItem('sc_pin', p);
  if (await send([])) toast('管理員驗證成功');
}

function qualifyPreview(rid) {
  const r = R(rid), q = new Set(qualifiers(rid).map(x => x.c.id)), n = +r.advance || 0;
  const groups = r.advMode === 'group' ? [...new Set(r.contestants.map(c => c.group || ''))] : [null];
  return groups.map(g => {
    const { rows, scored } = g === null ? rankRound(rid, '') : rankRound(rid, g, true);
    const qn = scored.filter(x => q.has(x.c.id)).length, tie = qn > n;
    return `<div class="qp"><div class="row between"><b>${g === null ? '總排名' : esc(g || '未分組')}</b><span class="small muted">取前 ${n} 名・目前晉級 ${qn} 位${tie ? '<span class="warn">（含同分）</span>' : ''}・未評分 ${rows.length - scored.length} 位</span></div>
      <div class="qp-list">${scored.map(x => `<div class="qp-row ${q.has(x.c.id) ? 'in' : ''}"><span class="qp-rk">${x.rank}</span><span class="qp-nm">${esc(x.c.name)}</span><span class="qp-sc">${fmt(x.f)}</span><span class="qp-tag">${q.has(x.c.id) ? '✓ 晉級' : ''}</span></div>`).join('') || '<div class="muted small" style="padding:8px">尚無成績</div>'}</div></div>`;
  }).join('');
}

const ck2 = (rid, f, val, label) => `<label class="ck"><input type="checkbox" data-rd="${rid}" data-f="${f}" ${val ? 'checked' : ''}> ${label}</label>`;
async function doAdvance(rid, auto) {
  const r = R(rid), q = qualifiers(rid);
  if (!(+r.advance > 0)) { toast('請先設定晉級名額'); return; }
  if (!q.length) { if (!auto) toast('還沒有成績，無法產生晉級名單'); return; }
  let nid = nextRid(rid), nextName;
  const ops = [];
  if (!nid) {
    nid = 'r' + uid().slice(0, 6); const ids = [...S.roundIds]; ids.splice(ids.indexOf(rid) + 1, 0, nid);
    const nr = ROUND_DEFAULT(ids.indexOf(nid)); nextName = nr.name;
    ops.push({ op: 'set', path: ['roundIds'], value: ids }, { op: 'set', path: ['rounds', nid], value: nr });
  } else {
    nextName = rName(nid);
    if (hasScores(nid)) { if (!auto) alert(`${nextName}已經開始評分，不能重新產生名單。\n如需重來，請先到「資料備份」清除${nextName}的分數。`); return; }
    if (!auto && R(nid).contestants.length && !confirm(`${nextName}已有 ${R(nid).contestants.length} 位名單，要用最新成績重新產生嗎？`)) return;
  }
  const gOrder = [...new Set(r.contestants.map(c => c.group || ''))];
  const list = [...q].sort((a, b) => {
    const g = r.advMode === 'group' ? gOrder.indexOf(a.c.group || '') - gOrder.indexOf(b.c.group || '') : 0;
    if (g) return g;
    return r.advOrder === 'reverse' ? a.f - b.f : r.advOrder === 'rank' ? b.f - a.f : a.i - b.i;
  });
  const entries = list.map(x => { const id = uid(); return { id, pid: x.c.pid, name: x.c.name, group: x.c.group || '', song: r.keepSong ? x.c.song || '' : '', artist: r.keepSong ? x.c.artist || '' : '', from: x.c.id }; });
  ops.push({ op: 'set', path: ['rounds', nid, 'contestants'], value: entries }, { op: 'set', path: ['rounds', nid, 'current'], value: null });
  if (await send(ops)) toast(`${auto ? '本賽次已全部完成，已自動' : '已'}產生${nextName}名單：${entries.length} 位晉級`);
}

/* ---------- 素材（海報、背景、Logo） ---------- */
let assetVer = 0;
const assetCache = new Map();
function assetSrc(id) {
  const v = assetCache.get(id);
  if (v && v.startsWith('data:')) return v;
  if (v === undefined) {
    assetCache.set(id, 'loading');
    loadAsset(id).then(d => { assetCache.set(id, d); assetVer++; render(); })
      .catch(() => { assetCache.set(id, 'error'); setTimeout(() => { assetCache.delete(id); assetVer++; render(); }, 8000); });
  }
  return '';
}
const idbOpen = () => new Promise((res, rej) => { const r = indexedDB.open('sc_assets', 1); r.onupgradeneeded = () => r.result.createObjectStore('a'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function idbOp(fn, m) { const db = await idbOpen(); return new Promise((res, rej) => { const tx = db.transaction('a', m); const q = fn(tx.objectStore('a')); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); }); }
const idbGet = id => idbOp(s => s.get(id), 'readonly').then(v => { if (!v) throw new Error('missing'); return v; });
const idbPut = (id, d) => idbOp(s => s.put(d, id), 'readwrite');
const idbDel = id => idbOp(s => s.delete(id), 'readwrite');

// 雲端模式：圖片放在另一個自動建立的 secret Gist，避免每次同步都下載大圖
let gA = { gid: null, files: null, p: null };
async function gAssetGist(create) {
  let gid = S.settings.assetGist;
  if (gid || !create) return gid;
  if (!GIST.token) throw new Error('需要 GitHub 權杖');
  const r = await fetch('https://api.github.com/gists', { method: 'POST', headers: gHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({ description: `${S.settings.title}・大螢幕素材（評分系統自動建立）`, public: false, files: { 'README.md': { content: '這個 Gist 由歌唱比賽評分系統自動建立，用來存放大螢幕的海報與圖片，請勿手動修改。' } } }) });
  if (!r.ok) throw new Error(gErrMsg(r.status));
  gid = (await r.json()).id;
  if (!await gSend([{ op: 'set', path: ['settings', 'assetGist'], value: gid }])) throw new Error('無法記錄素材 Gist');
  return gid;
}
function gAssetFiles(gid, force) {
  if (!force && gA.gid === gid && gA.files) return Promise.resolve(gA.files);
  if (gA.p && gA.gid === gid) return gA.p;
  gA.gid = gid;
  gA.p = fetch(GAPI + gid, { cache: 'no-store', headers: gHeaders() })
    .then(r => { if (!r.ok) throw new Error(gErrMsg(r.status)); return r.json(); })
    .then(g => { gA.files = g.files || {}; gA.p = null; return gA.files; })
    .catch(e => { gA.p = null; throw e; });
  return gA.p;
}
async function gAssetGet(id) {
  const gid = S.settings.assetGist; if (!gid) throw new Error('no asset gist');
  const name = `asset-${id}.txt`;
  let files = await gAssetFiles(gid), f = files[name];
  if (!f) { files = await gAssetFiles(gid, true); f = files[name]; }
  if (!f) throw new Error('missing');
  if (!f.truncated && f.content) return f.content;
  const r = await fetch(f.raw_url, { cache: 'no-store' }); if (!r.ok) throw new Error('raw');
  return r.text();
}
async function gAssetWrite(id, data) {
  const gid = await gAssetGist(data != null);
  if (!gid) return;
  const name = `asset-${id}.txt`;
  const r = await fetch(GAPI + gid, { method: 'PATCH', headers: gHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ files: { [name]: data == null ? null : { content: data } } }) });
  if (!r.ok) throw new Error(gErrMsg(r.status));
  if (gA.gid === gid && gA.files) { if (data == null) delete gA.files[name]; else gA.files[name] = { content: data }; }
}
async function loadAsset(id) {
  if (mode === 'gist') return gAssetGet(id);
  if (mode === 'server') { const r = await fetch('/api/asset/' + id); if (!r.ok) throw new Error('missing'); return r.text(); }
  return idbGet(id);
}
async function saveAsset(id, data) {
  if (mode === 'gist') return gAssetWrite(id, data);
  if (mode === 'server') {
    const r = await fetch('/api/asset', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id, data, pin: sessionStorage.getItem('sc_pin') || '' }) });
    if (r.status === 403) throw new Error('管理員 PIN 錯誤'); if (!r.ok) throw new Error('伺服器錯誤 ' + r.status); return;
  }
  return idbPut(id, data);
}
function deleteAssetData(id) {
  if (mode === 'gist') return gAssetWrite(id, null);
  if (mode === 'server') return fetch('/api/asset', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id, delete: true, pin: sessionStorage.getItem('sc_pin') || '' }) });
  return idbDel(id);
}
// 自動壓縮成適合投影的大小（最長邊 1920px、約 900KB 以內）
async function compressImage(file) {
  const url = URL.createObjectURL(file);
  const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('無法讀取圖片')); i.src = url; });
  URL.revokeObjectURL(url);
  const W = im.naturalWidth || 1600, H = im.naturalHeight || 900, alpha = /png|webp|gif|svg/.test(file.type);
  let max = 1920, q = 0.86, out = '', w = W, h = H;
  for (let t = 0; t < 7; t++) {
    const sc = Math.min(1, max / Math.max(W, H)); w = Math.max(1, Math.round(W * sc)); h = Math.max(1, Math.round(H * sc));
    const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
    if (!alpha) { x.fillStyle = '#000'; x.fillRect(0, 0, w, h); }
    x.drawImage(im, 0, 0, w, h);
    out = c.toDataURL('image/webp', q);
    if (!out.startsWith('data:image/webp')) out = alpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', q);
    if (out.length <= 900000) break;
    max = Math.round(max * 0.82); q = Math.max(0.6, q - 0.07);
  }
  return { data: out, w, h };
}
async function uploadAssets(files) {
  const added = [];
  for (const f of files) {
    if (!f.type.startsWith('image/')) { toast(f.name + ' 不是圖片檔'); continue; }
    try {
      toast(`處理中：${f.name}`);
      const { data, w, h } = await compressImage(f), id = uid();
      await saveAsset(id, data); assetCache.set(id, data);
      added.push({ id, name: f.name, w, h, size: data.length, at: Date.now() });
    } catch (e) { toast(`上傳失敗：${f.name}（${e.message || e}）`); }
  }
  if (added.length && await send([{ op: 'set', path: ['assets'], value: [...S.assets, ...added] }])) toast(`已上傳 ${added.length} 張圖片`);
}

  },
  crAdd() { const id = 'c' + uid().slice(0, 5); pendingFocus = `cr_${id}_name`; send([{ op: 'set', path: ['criteria'], value: [...S.criteria, { id, name: '新項目', weight: 0 }] }]); },
  crDel(b) { if (!confirm('確定刪除這個評分項目？')) return; send([{ op: 'set', path: ['criteria'], value: S.criteria.filter(c => c.id !== b.dataset.id) }]); },
  resSort(b) { resSort = b.dataset.v; render(); },
  resRound(b) { resRid = b.dataset.r; render(); },
  csv() {
    const rid = S.rounds[resRid] ? resRid : S.round, rd = R(rid), { rows, scored } = rankRound(rid, ''), q = new Set(qualifiers(rid).map(x => x.c.id));
    const rk = new Map(scored.map(x => [x.c.id, x.rank]));
    const head = ['賽次', '名次', '出場序', '姓名', '組別', '曲目', '原唱/備註', ...S.judges.flatMap(j => [...S.criteria.map(c => `${j.name}-${c.name}`), `${j.name}-總分`, `${j.name}-評語`]), '本賽次平均', '總成績', '晉級', '狀態'];
    const data = rows.map(x => {
      const sc = S.scores[x.c.id] || {};
      return [rd.name, rk.get(x.c.id) ?? '', x.i + 1, x.c.name, x.c.group, x.c.song, x.c.artist,
        ...S.judges.flatMap(j => { const s = sc[j.id]; return [...S.criteria.map(c => s && s.items[c.id] != null ? fmtIn(s.items[c.id]) : ''), s ? fmt(judgeTotal(s)) : '', s ? s.comment || '' : '']; }),
        x.r.avg == null ? '' : fmt(x.r.avg), x.f == null ? '' : fmt(x.f), q.has(x.c.id) ? '晉級' : '', ST_LABEL[stOf(x.c.id)]];
    });
    const csv = '\ufeff' + [head, ...data].map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
    download(csv, `${S.settings.title}-${rd.name}-成績-${new Date().toISOString().slice(0, 10)}.csv`, 'text/csv;charset=utf-8');
  },
  grpReset(b) {
    const g = b.dataset.g, what = b.dataset.w, all = gsScope === 'all';
    const rids = all ? S.roundIds : [S.round], label = g || '未分組';
    const hit = rids.flatMap(id => R(id).contestants.filter(c => (c.group || '') === g).map(c => [id, c]));
    if (!hit.length) { toast(`${all ? '' : rName() + '的'}「${label}」沒有資料`); return; }
    const scope = all ? '全部賽次' : rName();
    if (!confirm(what === 'list' ? `確定清除${scope}「${label}」的名單（${hit.length} 筆）？\n這些選手的分數也會一併刪除，無法復原。` : `確定清除${scope}「${label}」的所有分數（${hit.length} 筆）？\n名單會保留，狀態回到「待評分」。`)) return;
    const ops = [];
    hit.forEach(([, c]) => ops.push({ op: 'del', path: ['scores', c.id] }, { op: 'del', path: ['status', c.id] }));
    if (what === 'list') rids.forEach(id => {
      const r = R(id), keep = r.contestants.filter(c => (c.group || '') !== g);
      if (keep.length !== r.contestants.length) { ops.push({ op: 'set', path: ['rounds', id, 'contestants'], value: keep }); if (r.current && !keep.some(c => c.id === r.current)) ops.push({ op: 'set', path: ['rounds', id, 'current'], value: null }); }
    });
    send(ops).then(ok => ok && toast(`已清除「${label}」的${what === 'list' ? '名單' : '分數'}`));
  },
  exportJson() { download(JSON.stringify(S, null, 2), `${S.settings.title}-備份-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '')}.json`, 'application/json'); },
  clearScores() { if (!confirm('確定清除「所有」評分與評分狀態？此動作無法復原（建議先匯出備份）。')) return; send([{ op: 'set', path: ['scores'], value: {} }, { op: 'set', path: ['status'], value: {} }, ...S.roundIds.map(id => ({ op: 'set', path: ['rounds', id, 'current'], value: null }))]); },
  resetAll() { if (!confirm('確定全部重設？選手、評審、設定與分數都會清空（建議先匯出備份）。')) return; if (!confirm('再次確認：真的要全部重設嗎？')) return; send([{ op: 'replace', path: [], value: {} }]); }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled && ACT[b.dataset.act]) ACT[b.dataset.act](b, e); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.pv && pv) { setPv(t.dataset.pv, t.type === 'checkbox' ? t.checked : t.dataset.pvt === 'num' ? +t.value : t.value); return; }
  if (t.id === 'devLabel') { me.label = t.value.trim(); saveMe(); return; }
  if (t.dataset.crit) { setCrit(t); return; }
  if (t.id === 'jCmt' && S.current) { const k = dk(S.current); drafts[k] = drafts[k] || baseDraft(S.current); drafts[k].comment = t.value; saveDrafts(); updateTotal(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pv) return;
  if (t.id === 'assetFile' && t.files.length) { uploadAssets([...t.files]); t.value = ''; return; }
  if (t.id === 'autoTake') { autoTake = t.checked; sessionStorage.setItem('sc_autotake', autoTake ? '1' : ''); if (autoTake) ACT.take(); render(); return; }
  if (t.id === 'devLabel') { reconnect(); render(); return; }
  if (t.dataset.crit) { if (t.type === 'number' && t.value !== '') { t.value = Math.max(0, Math.min(scale(), +t.value)); setCrit(t); } return; }
  if (t.dataset.rd) {
    const f = t.dataset.f, v = t.type === 'checkbox' ? t.checked : (f === 'advance' || f === 'carry') ? Math.max(0, Math.min(f === 'carry' ? 100 : 999, Math.round(+t.value || 0))) : (t.value.trim() || R(t.dataset.rd).name);
    send([{ op: 'set', path: ['rounds', t.dataset.rd, f], value: v }]); return;
  }
  if (t.dataset.ct) { const rid = ctRid || S.round, list = clone(R(rid).contestants), c = list.find(x => x.id === t.dataset.ct); if (!c) return; c[t.dataset.f] = t.value.trim(); send([{ op: 'set', path: ['rounds', rid, 'contestants'], value: list }]); return; }
  if (t.dataset.jd) { const list = clone(S.judges), j = list.find(x => x.id === t.dataset.jd); j.name = t.value.trim() || j.name; send([{ op: 'set', path: ['judges'], value: list }]); return; }
  if (t.dataset.cr) { const list = clone(S.criteria), c = list.find(x => x.id === t.dataset.cr); c[t.dataset.f] = t.dataset.f === 'weight' ? Math.max(0, +t.value || 0) : (t.value.trim() || c.name); send([{ op: 'set', path: ['criteria'], value: list }]); return; }
  if (t.dataset.set) { send([{ op: 'set', path: ['settings', t.dataset.set], value: t.dataset.set === 'decimals' ? +t.value : (t.value.trim() || '歌唱比賽') }]); return; }
  if (t.id === 'seatCount') {
    const n = +t.value; let list = clone(S.judges);
    if (n < list.length) { if (!confirm(`將評審人數減為 ${n} 位？最後 ${list.length - n} 個評審席會被移除，其分數不再計入。`)) { t.value = S.judges.length; return; } list = list.slice(0, n); }
    while (list.length < n) { let k = 1; while (list.some(j => j.id === 's' + k)) k++; list.push({ id: 's' + k, name: '評審老師 ' + String.fromCharCode(65 + list.length) }); }
    send([{ op: 'set', path: ['judges'], value: list }]); return;
  }
  if (t.id === 'gsScope') { gsScope = t.value; return; }
  if (t.id === 'resGroup') { resGroup = t.value; render(); return; }
  if (t.id === 'impFile' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => { try { const obj = JSON.parse(r.result); if (!confirm('匯入會覆蓋目前所有資料，確定嗎？')) return; send([{ op: 'replace', path: [], value: obj }]).then(ok => ok && toast('匯入完成')); } catch (err) { toast('檔案格式錯誤'); } t.value = ''; };
    r.readAsText(t.files[0]);
  }
});
// 評審：在分數格按 Enter 跳到下一格
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches('input[type=number][data-crit]')) return;
  e.preventDefault(); const all = [...document.querySelectorAll('input[type=number][data-crit]')]; const i = all.indexOf(e.target);
  if (all[i + 1]) all[i + 1].focus(); else { const b = document.querySelector('[data-act=submit]'); b && !b.disabled ? b.focus() : e.target.blur(); }
});
document.addEventListener('focusout', () => setTimeout(render, 30));

render();
connect();
</script>
</body>
